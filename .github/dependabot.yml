# Dependabot du template : uniquement ce qui appartient au template.
# Les projets récupèrent ces montées de version via ./scripts/update-from-template.sh.
# La config des projets générés est dans .template/dependabot.yml (installée par init.sh).
version: 2
updates:
  # Sous-charts déclarés dans helm/Chart.yaml (+ Chart.lock)
  - package-ecosystem: helm
    directory: /helm
    schedule:
      interval: weekly
    groups:
      subcharts:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
