# Dependabot du template.
# Les projets ont leur propre Dependabot, qui suit aussi les sous-charts.
# La config des projets générés est dans .template/dependabot.yml (installée par init.sh).
version: 2
updates:
  # Sous-charts déclarés dans helm/Chart.yaml (+ Chart.lock)
  - package-ecosystem: helm
    directory: /helm
    schedule:
      interval: weekly
    groups:
      subcharts:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
