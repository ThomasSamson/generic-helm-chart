{{- with .Values.networkPolicy }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tilleuls.fullname" $ }}
  labels:
    {{- include "tilleuls.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tilleuls.selectorLabels" $ | nindent 6 }}
  policyTypes:
    {{- toYaml .policyTypes | nindent 4 }}
  {{- if has "Ingress" .policyTypes }}
  ingress:
    {{- tpl (toYaml (.ingress | default list)) $ | nindent 4 }}
  {{- end }}
  {{- if has "Egress" .policyTypes }}
  egress:
    {{- tpl (toYaml (.egress | default list)) $ | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
