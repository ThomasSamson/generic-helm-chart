{{- range $key, $route := .Values.httpRoutes }}
{{- if $route.enabled }}
{{- $name := include "tilleuls.resourceName" (dict "root" $ "suffix" $key) }}
{{- $basicAuth := and $.Values.basicAuth.enabled (ne $route.basicAuth false) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "tilleuls.labels" $ | nindent 4 }}
  {{- include "tilleuls.annotations" (dict "root" $ "annotations" $route.annotations) | nindent 2 }}
spec:
  parentRefs:
    {{- tpl (toYaml $route.parentRefs) $ | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  rules:
    {{- range $route.rules }}
    {{- $rule := omit . "backend" "basicAuth" }}
    {{- with .backend }}
    {{- $_ := set $rule "backendRefs" (list (dict "name" (include "tilleuls.resourceName" (dict "root" $ "suffix" (.service | default "app"))) "port" (.port | default 80))) }}
    {{- end }}
    {{- if and $basicAuth (ne .basicAuth false) }}
    {{- $filter := dict "type" "ExtensionRef" "extensionRef" (dict "group" "traefik.io" "kind" "Middleware" "name" (include "tilleuls.basicAuthName" $)) }}
    {{- $_ := set $rule "filters" (prepend ($rule.filters | default list) $filter) }}
    {{- end }}
    - {{- tpl (toYaml $rule) $ | nindent 6 }}
    {{- end }}
{{- with $route.httpsRedirect }}
{{- if .enabled }}
---
# Redirection HTTP → HTTPS sur le listener HTTP du Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-redirect
  labels:
    {{- include "tilleuls.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- tpl (toYaml .parentRefs) $ | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
{{- end }}
{{- end }}
