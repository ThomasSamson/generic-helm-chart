apiVersion: v2
name: generic-app
description: >-
  Chart générique Les Tilleuls : n'importe quelle application conteneurisée
  (API, PWA, workers, cronjobs, jobs) avec PostgreSQL CloudNativePG et
  dépendances optionnelles (Valkey, Mercure, Meilisearch, Maildev),
  pilotée uniquement par les values.
type: application
version: 0.1.0
appVersion: "latest"
keywords:
  - generic
  - symfony
  - frankenphp
  - cloudnative-pg
  - valkey
  - mercure

# Chaque dépendance est activée par `addons.<nom>.enabled` (et non `<nom>.enabled`) :
# certains sous-charts (mercure) ont un schéma strict qui refuse toute clé inconnue.
# La configuration propre au sous-chart va sous la clé `<nom>:` des values.
dependencies:
  - name: cluster
    alias: cnpg
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: addons.cnpg.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm/
    condition: addons.valkey.enabled
  - name: mercure
    version: 1.0.4
    repository: https://charts.mercure.rocks
    condition: addons.mercure.enabled
  - name: meilisearch
    version: 0.40.0
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: addons.meilisearch.enabled
  - name: maildev
    version: 0.5.0
    repository: https://thomassamson.github.io/helm-maildev/
    condition: addons.maildev.enabled
